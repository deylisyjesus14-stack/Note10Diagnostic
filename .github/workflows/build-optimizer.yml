name: Build Note10 Optimizer APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "Note10Optimizer_READY_TO_BUILD.zip"
      - ".github/workflows/build-optimizer.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract optimizer source
        run: |
          rm -rf optimizer
          unzip -q Note10Optimizer_READY_TO_BUILD.zip
          cp -R Note10Optimizer/. ./optimizer

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build optimizer APK
        working-directory: optimizer
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle --no-daemon clean assembleDebug

      - name: Verify and rename APK
        run: |
          test -f optimizer/app/build/outputs/apk/debug/app-debug.apk
          cp optimizer/app/build/outputs/apk/debug/app-debug.apk JESUSDROIDL-Note10-Optimizer-v1.apk

      - name: Upload optimizer APK
        uses: actions/upload-artifact@v4
        with:
          name: JESUSDROIDL-Note10-Optimizer-APK
          path: JESUSDROIDL-Note10-Optimizer-v1.apk
          if-no-files-found: error
          retention-days: 30
